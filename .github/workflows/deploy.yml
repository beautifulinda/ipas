name: 檢查並部署到 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支有新的推送時，取消還在跑的舊流程；避免舊版比新版晚部署，把網站蓋回舊版
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 題庫檢查、型別檢查、單元測試；任何一項失敗就不部署
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # 比對所有提交裡有沒有考古題的題目文字
          fetch-depth: 0
      # 官方公告試題放在私人 repo；PR 只檢查公開內容，部署前一定要讀得到
      - name: 讀取私人題庫
        id: private
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: beautifulinda/ipas-past-papers
          path: data/private
          ssh-key: ${{ secrets.PAST_PAPERS_DEPLOY_KEY }}
      - name: 讀不到私人題庫就不部署
        if: steps.private.outcome == 'failure'
        run: |
          echo "::error::讀不到私人題庫：請確認部署金鑰 PAST_PAPERS_DEPLOY_KEY 仍有效。網站維持上一版。"
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - name: 題庫檢查
        run: npm run validate -- ${{ github.event_name != 'pull_request' && '--require-private' || '' }}
      - run: npm run typecheck
      - run: npm test

  # 從 package-lock.json 讀出 Playwright 版本，e2e 用同版本的官方映像檔；升級 Playwright 時不用另外改這裡
  playwright-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # E2E：用假題庫建置網站，在桌面、Android、iPhone 三種瀏覽器跑標了 @e2e 的需求場景
  # 在 Playwright 官方映像檔裡跑：系統套件與瀏覽器都已裝好，不用每次從 Ubuntu 鏡像站下載（鏡像站慢時曾卡住 30 分鐘以上）
  e2e:
    needs: playwright-version
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Chromium 建議的設定，避免共享記憶體不足而當掉
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run e2e:build
      - run: npm run e2e
      # 失敗時保留報告（截圖、操作追蹤），可在 Actions 頁面下載
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    needs: [check, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 讀取私人題庫
        uses: actions/checkout@v7
        with:
          repository: beautifulinda/ipas-past-papers
          path: data/private
          ssh-key: ${{ secrets.PAST_PAPERS_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run generate
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
          # v4 起預設不放隱藏檔；照舊放進 .nojekyll，網站內容和升級前一樣
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      # deploy-pages v4 起需要讀取 Actions
      actions: read
    # 部署本身不中途取消，避免 Pages 停在部署一半的狀態
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

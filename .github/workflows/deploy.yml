name: 檢查並部署到 GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 題庫檢查、型別檢查、單元測試；任何一項失敗就不部署
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 比對所有提交裡有沒有考古題的題目文字
          fetch-depth: 0
      # 官方公告試題放在私人 repo；PR 只檢查公開內容，部署前一定要讀得到
      - name: 讀取私人題庫
        id: private
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: beautifulinda/ipas-past-papers
          path: data/private
          ssh-key: ${{ secrets.PAST_PAPERS_DEPLOY_KEY }}
      - name: 讀不到私人題庫就不部署
        if: steps.private.outcome == 'failure'
        run: |
          echo "::error::讀不到私人題庫：請確認部署金鑰 PAST_PAPERS_DEPLOY_KEY 仍有效。網站維持上一版。"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - name: 題庫檢查
        run: npm run validate -- ${{ github.event_name != 'pull_request' && '--require-private' || '' }}
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀取私人題庫
        uses: actions/checkout@v4
        with:
          repository: beautifulinda/ipas-past-papers
          path: data/private
          ssh-key: ${{ secrets.PAST_PAPERS_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run generate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
